[project]
name = "reportrender"
version = "0.1.0"
description = "报告渲染层：pages + 报告数据包 → 单册自包含 HTML。确定性、零 LLM——gen-locked 的执行者，不是生成者（裁决 2026-08-29：独立仓，纯库+CLI 先行，后续报告产出上线时建立服务）"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
]

# 暂不依赖 ishome-contracts：git dep 的 tag 引用只带 gen/python 生成代码，而渲染层要消费的
# 锁定文案数据文件将落在 contracts 注册表目录（不编进生成代码——编进去等于把"写作层结构性
# 拿不到正文"改成拿得到，见交接文档追记二）。取用形态等该数据文件落地时定，此刻加依赖是死重。

[project.scripts]
reportrender = "reportrender.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reportrender"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
]

# ---------------------------------------------------------------------------
# ruff（lint + format）——口径同 ishome-reportgen / ishome-aipipe
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# mypy（strict）
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# import-linter：模块依赖方向契约（违规挂质量门）。
# 规则来源：《开发规范与代码分层》§1.0/§1.3；禁 utils/common/helpers 目录。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["reportrender"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "cli → render → anchor_text → models 单向"
type = "layers"
layers = ["cli", "render", "anchor_text", "models"]
containers = ["reportrender"]
